[package]
name = "hcs-daemon"
version = "2.0.0"
edition = "2021"
authors = ["timfromhcs <timfromhcs@gmail.com>"]
description = "HCS Local AI unified daemon - OpenAI & Anthropic compatible API, Prism & SD.cpp Vulkan orchestration, agent runtime, persistent memory, and browser dashboard"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["multipart"] }
anyhow = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
async-stream = "0.3"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sysinfo = "0.33"
tempfile = "3.17"
base64 = "0.22"
mime_guess = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
